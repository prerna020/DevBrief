name: DevBrief Code Review

on:
  pull_request:
    types: [opened, synchronize, reopened]

  issue_comment:
    types: [created]

concurrency:
  group: devbrief-review-${{ github.event.pull_request.number || github.event.issue.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  review:
    if: >
      (github.event_name == 'pull_request' &&
       github.event.pull_request.head.repo.full_name == github.repository) ||
      (github.event_name == 'issue_comment' &&
       github.event.issue.pull_request &&
       (contains(github.event.comment.body, '/devbrief review') ||
        contains(github.event.comment.body, '/leo review')))

    runs-on: ubuntu-latest

    steps:
      - name: Check out DevBrief (The AI Agent)
        uses: actions/checkout@v4
        with:
          repository: oscardaly/pr-review-agent
          ref: main

      - uses: oven-sh/setup-bun@v2

      - run: bun install --frozen-lockfile

      - name: Configure DevBrief Persona and Settings
        run: |
          sed -i 's/tags: \["pr-review-agent"\],/tags: \["pr-review-agent"\], maxConcurrency: 1,/' src/commands/review.ts
          sed -i 's/export const AGENT_NAME = "Leo";/export const AGENT_NAME = "DevBrief";/' src/persona.ts
          sed -i 's/— \${AGENT_NAME} 🎨.*/— \${AGENT_NAME} ⚡ _(AI Code Review \& Developer Briefing)_`;/' src/persona.ts
          sed -i 's/Voice — you are Leo/Voice — you are DevBrief/g' src/persona.ts
          sed -i 's/Leo/DevBrief/g' src/persona.ts

      - name: Fetch the PR diff and metadata
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number || github.event.issue.number }}
        run: |
          gh pr diff "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" > /tmp/pr.diff

          gh pr view "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" \
            --json number,title,body,author \
            --jq '{number: .number, title: .title, description: (.body // ""), author: .author.login, repository: env.GITHUB_REPOSITORY}' \
            > /tmp/pr-metadata.json

      - name: Run DevBrief
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_AGENT_GITHUB_REPO: ${{ github.repository }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_BASE_URL: "https://generativelanguage.googleapis.com/v1beta/openai/"
          PR_AGENT_MODEL: "gemini-3.5-flash"
        run: bun src/cli.ts review --diff /tmp/pr.diff --pr /tmp/pr-metadata.json
