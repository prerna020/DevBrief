name: leo-review

on:
  pull_request:
    types: [opened, synchronize, reopened]

  issue_comment:
    types: [created]

concurrency:
  group: leo-review-${{ github.event.pull_request.number || github.event.issue.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  review:
    if: >
      (github.event_name == 'pull_request' &&
       github.event.pull_request.head.repo.full_name == github.repository) ||
      (github.event_name == 'issue_comment' &&
       github.event.issue.pull_request &&
       contains(github.event.comment.body, '/leo review'))

    runs-on: ubuntu-latest

    steps:
      - name: Check out Leo (The AI Agent)
        uses: actions/checkout@v4
        with:
          repository: oscardaly/pr-review-agent
          ref: main

      - uses: oven-sh/setup-bun@v2

      - run: bun install --frozen-lockfile

      - name: Apply Gemini Rate Limit Fix
        run: |
          sed -i 's/tags: \["pr-review-agent"\],/tags: \["pr-review-agent"\], maxConcurrency: 1,/' src/commands/review.ts

      - name: Fetch the PR diff and metadata
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number || github.event.issue.number }}
        run: |
          gh pr diff "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" > /tmp/pr.diff

          gh pr view "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" \
            --json number,title,body,author \
            --jq '{number: .number, title: .title, description: (.body // ""), author: .author.login, repository: env.GITHUB_REPOSITORY}' \
            > /tmp/pr-metadata.json

      - name: Run Leo
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_AGENT_GITHUB_REPO: ${{ github.repository }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_BASE_URL: "https://generativelanguage.googleapis.com/v1beta/openai/"
          PR_AGENT_MODEL: "gemini-2.5-flash"
        run: bun src/cli.ts review --diff /tmp/pr.diff --pr /tmp/pr-metadata.json
