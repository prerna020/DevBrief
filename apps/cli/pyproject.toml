[project]
name = "devbrief-cli"
version = "0.2.2"
description = "Command-line client for DevBrief, an automated code review tool."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "devbrief-review-core>=0.1.0,<0.2.0",
    "httpx>=0.28.1",
    "rich>=15.0.0",
    "typer>=0.27.1",
    "pyyaml>=6.0",
    "platformdirs>=4.0",
]

[project.scripts]
devbrief = "devbrief_cli.main:app"

[tool.uv.sources]
devbrief-review-core = { workspace = true }

[tool.uv]
package = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["devbrief_cli"]

[tool.hatch.build.targets.sdist]
include = ["devbrief_cli", "README.md"]
