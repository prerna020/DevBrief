# Local services for DevBrief. Only Redis is needed for the pull request
# reviews (the job queue). The database is Neon; the postgres service below is
# optional and unused by the setup scripts.
#
# `name` sets the Docker Desktop stack name. Without it, Docker uses the folder
# name. It is not just "devbrief" because another project on this computer
# already uses that stack name.
name: devbrief-reviewer

services:
  postgres:
    image: postgres:16-alpine
    container_name: devbrief-postgres-local
    environment:
      POSTGRES_USER: devbrief
      POSTGRES_PASSWORD: devbrief
      POSTGRES_DB: devbrief
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: devbrief-redis
    ports:
      - "6379:6379"

volumes:
  pg_data:
