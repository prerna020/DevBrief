services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: devbrief
      POSTGRES_USER: devbrief
      POSTGRES_PASSWORD: devbrief
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U devbrief -d devbrief"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql/data

  migrate:
    image: python:3.11-slim
    working_dir: /workspace
    volumes:
      - .:/workspace
    environment:
      DATABASE_URL: postgresql://devbrief:devbrief@postgres:5432/devbrief
    depends_on:
      postgres:
        condition: service_healthy
    command: >
      sh -c "pip install --no-cache-dir asyncpg && python -m app.db.apply_migrations"

volumes:
  postgres_data:
