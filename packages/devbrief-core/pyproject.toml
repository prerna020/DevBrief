[project]
name = "devbrief-review-core"
version = "0.1.1"
description = "Shared models, diff parsing, and code-chunking utilities for DevBrief, an automated code review tool."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "langchain-text-splitters>=1.1.2",
    "pydantic>=2",
    "unidiff>=0.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["devbrief_core"]

[tool.hatch.build.targets.sdist]
include = ["devbrief_core", "README.md"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
