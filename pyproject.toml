[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "devbrief-core"
version = "0.1.0"
description = "AI-powered pull-request review engine"
requires-python = ">=3.11"
dependencies = [
  "groq>=0.31.0",
  "pydantic>=2.10.0",
  "python-dotenv>=1.0.1",
  "fastapi>=0.115.0",
  "httpx>=0.28.0",
  "PyJWT[crypto]>=2.10.0",
  "asyncpg>=0.30.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.0",
  "pytest-asyncio>=0.25.0",
  "uvicorn>=0.34.0",
]

[dependency-groups]
dev = [
  "pytest>=8.3.0",
  "pytest-asyncio>=0.25.0",
  "uvicorn>=0.34.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
pythonpath = [".", "src"]
